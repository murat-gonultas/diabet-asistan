spring:
  application:
    name: diabet-asistan-api

  datasource:
    url: jdbc:h2:mem:diabet_asistan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  safety:
    insulin-dose-calculation-enabled: false
    pump-control-enabled: false
    medical-treatment-recommendations-enabled: false
